<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Streakly — Offline</title>
<style>
  :root {
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
    color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
      Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  main {
    max-width: 360px;
    text-align: center;
  }
  .ring {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: linear-gradient(180deg, #ffb03a, #ff453a);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ring svg {
    width: 28px;
    height: 28px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 8px;
  }
  p {
    font-size: 14px;
    color: #98989d;
    line-height: 1.5;
    margin: 0 0 24px;
  }
  button {
    appearance: none;
    border: none;
    border-radius: 16px;
    background: #f5f5f7;
    color: #000;
    font-size: 15px;
    font-weight: 500;
    padding: 14px 28px;
    cursor: pointer;
  }
  button:active {
    transform: scale(0.98);
  }
</style>
</head>
<body>
  <main>
    <div class="ring">
      <svg viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.58 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01"/>
      </svg>
    </div>
    <h1>You're offline</h1>
    <p>Streakly needs a connection to load your activity and leaderboard. Reconnect and try again — nothing was lost.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
